[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horshmon"
version = "1.0.0"
description = "Lightweight uptime, SSL certificate and server health monitor with Telegram alerts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "horshmarny"}]
keywords = ["monitoring", "uptime", "ssl", "certificate-expiry", "telegram", "devops", "healthcheck", "cli", "server-monitoring", "alerting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/horshmarny200/horshmon"
Issues = "https://github.com/horshmarny200/horshmon/issues"

[project.scripts]
horshmon = "horshmon.run:main"

[tool.setuptools.packages.find]
include = ["horshmon*"]